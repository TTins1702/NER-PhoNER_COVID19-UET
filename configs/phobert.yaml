experiment_name: phobert_full_last_softmax
seed: 42

data:
  level: word
  data_dir: data
  max_seq_length: 256

model:
  name: phobert
  pretrained_name: vinai/phobert-base-v2
  feature_mode: last_layer # last_layer | concat_last_4
  use_crf: false # true for PhoBERT + CRF ablation
  freeze_backbone: false # true for frozen-backbone ablation
  dropout: 0.1

training:
  batch_size: 16
  epochs: 5
  backbone_lr: 2.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  patience: 3
  checkpoint_dir: checkpoints/phobert/phobert_full_last_softmax

logging:
  use_wandb: true
  wandb_project: ner-phoner-covid19-uet
  output_dir: outputs/metrics
