experiment_name: phobert_full_last_softmax
seed: 42
model_name: vinai/phobert-base-v2
data_level: word
data_dir: data
max_seq_length: 256
feature_mode: last_layer
use_crf: false
freeze_backbone: false
dropout: 0.1
batch_size: 16
epochs: 5
backbone_lr: 2.0e-5
head_lr: 1.0e-3
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
checkpoint_dir: checkpoints/phobert
output_dir: outputs/metrics
wandb_project: ner-phoner-covid19-uet

data:
  level: word
  data_dir: data
  max_seq_length: 256

model:
  name: phobert
  pretrained_name: vinai/phobert-base-v2
  feature_mode: last_layer
  use_crf: false
  freeze_backbone: false
  dropout: 0.1

training:
  batch_size: 16
  epochs: 5
  backbone_lr: 2.0e-5
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  patience: 3
  checkpoint_dir: checkpoints/phobert

logging:
  use_wandb: true
  wandb_project: ner-phoner-covid19-uet
  output_dir: outputs/metrics

ablations:
  - experiment_name: phobert_full_last_softmax
    freeze_backbone: false
    feature_mode: last_layer
    use_crf: false
  - experiment_name: phobert_freeze_last_softmax
    freeze_backbone: true
    feature_mode: last_layer
    use_crf: false
  - experiment_name: phobert_full_concat4_softmax
    freeze_backbone: false
    feature_mode: concat_last_4
    use_crf: false
  - experiment_name: phobert_full_last_crf
    freeze_backbone: false
    feature_mode: last_layer
    use_crf: true
